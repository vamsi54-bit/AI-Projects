<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafLens</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
  select, input, button { font-size: 16px; margin: 6px 0; width: 100%; padding: 8px; }
  img { max-width: 48%; border-radius: 8px; }
  .row { display: flex; gap: 8px; }
  .warn { background: #fff3cd; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<h2>🌿 LeafLens</h2>
<select id="crop">
  <option>Tomato</option><option>Potato</option><option>Pepper</option><option>Other</option>
</select>
<input type="file" id="file" accept="image/*" capture="environment">
<button onclick="run()">Check leaf</button>
<div id="out"></div>
<script>
async function run() {
  const f = document.getElementById("file").files[0];
  if (!f) return alert("Choose a photo first");
  const fd = new FormData();
  fd.append("file", f);
  fd.append("crop", document.getElementById("crop").value);
  const out = document.getElementById("out");
  out.textContent = "Analysing...";
  const r = await fetch("/predict", { method: "POST", body: fd });
  const d = await r.json();
  if (!r.ok) { out.textContent = d.detail; return; }
  if (!d.supported) { out.textContent = d.message; return; }
  out.innerHTML =
    (d.not_sure ? `<p class="warn">${d.message}</p>` : "") +
    d.top2.map(t => `<p><b>${t.label}</b>: ${(t.confidence*100).toFixed(0)}%</p>`).join("") +
    `<div class="row"><img src="${URL.createObjectURL(f)}">` +
    `<img src="data:image/png;base64,${d.heatmap_png_base64}"></div>`;
}
</script>
</body>
</html>
